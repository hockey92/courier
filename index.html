<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zombie Maze</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d0f1a;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 12px;
    left: 16px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 18px;
    user-select: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    text-align: center;
  }
  #overlay h1 { font-size: 48px; margin: 0 0 12px; }
  #overlay p { font-size: 18px; margin: 6px 0; opacity: 0.85; }
  #overlay button {
    margin-top: 20px;
    padding: 12px 32px;
    font-size: 20px;
    border: none;
    border-radius: 999px;
    background: #4fd1c5;
    color: #0d0f1a;
    cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score: <span id="score">0</span> &nbsp; Lives: <span id="lives">3</span> &nbsp; Shots: <span id="shots">x1</span></div>
<div id="overlay">
  <h1>Zombie Maze</h1>
  <p>You are lost in an endless labyrinth full of zombies. You shoot automatically at any zombie you can see.</p>
  <p>They close in from beyond the edges of the screen. Move with WASD or the arrow keys.</p>
  <p>Grab the purple bonuses to fire more bullets at once.</p>
  <button id="start">Play</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const shotsEl = document.getElementById("shots");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("start");

const CELL = 64;
const WALL = 8;
const CHUNK = 8;
const CHUNK_PAD = 20;
const CHUNK_KEEP_DISTANCE = 5;
const LOOP_CHANCE = 0.15;
const PATH_MARGIN = 6;
const MAX_ENEMIES = 120;
const MAX_SHOTS = 7;
const BONUS_DURATION = 10;
const BONUS_LIFETIME = 8;

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const keys = {};
window.addEventListener("keydown", e => (keys[e.key.toLowerCase()] = true));
window.addEventListener("keyup", e => (keys[e.key.toLowerCase()] = false));

// ---------- Endless maze ----------
// The world is split into CHUNK x CHUNK blocks of cells. Each chunk is a seeded
// random maze that owns its top and left border walls, and always opens at least
// one gap in each of them, so every chunk connects to its neighbours.

let worldSeed = 0;
const chunks = new Map();

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function chunkSeed(cx, cy) {
  let h = worldSeed ^ Math.imul(cx, 0x9e3779b1) ^ Math.imul(cy, 0x85ebca77);
  h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
  h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
  return (h ^ (h >>> 16)) >>> 0;
}

function generateChunk(cx, cy) {
  const rand = mulberry32(chunkSeed(cx, cy));
  const h = Array.from({ length: CHUNK }, () => Array(CHUNK).fill(true));
  const v = Array.from({ length: CHUNK }, () => Array(CHUNK).fill(true));
  const visited = Array.from({ length: CHUNK }, () => Array(CHUNK).fill(false));

  const start = [Math.floor(rand() * CHUNK), Math.floor(rand() * CHUNK)];
  const stack = [start];
  visited[start[1]][start[0]] = true;
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const options = [];
    if (r > 0 && !visited[r - 1][c]) options.push([c, r - 1]);
    if (r < CHUNK - 1 && !visited[r + 1][c]) options.push([c, r + 1]);
    if (c > 0 && !visited[r][c - 1]) options.push([c - 1, r]);
    if (c < CHUNK - 1 && !visited[r][c + 1]) options.push([c + 1, r]);
    if (!options.length) { stack.pop(); continue; }
    const [nc, nr] = options[Math.floor(rand() * options.length)];
    if (nr < r) h[r][c] = false;
    else if (nr > r) h[nr][c] = false;
    else if (nc < c) v[r][c] = false;
    else v[r][nc] = false;
    visited[nr][nc] = true;
    stack.push([nc, nr]);
  }

  for (let r = 1; r < CHUNK; r++)
    for (let c = 0; c < CHUNK; c++)
      if (h[r][c] && rand() < LOOP_CHANCE) h[r][c] = false;
  for (let r = 0; r < CHUNK; r++)
    for (let c = 1; c < CHUNK; c++)
      if (v[r][c] && rand() < LOOP_CHANCE) v[r][c] = false;

  for (let i = 0; i < 2; i++) {
    h[0][Math.floor(rand() * CHUNK)] = false;
    v[Math.floor(rand() * CHUNK)][0] = false;
  }

  return { cx, cy, h, v, canvas: null };
}

function getChunk(cx, cy) {
  const key = cx * 1e6 + cy;
  let chunk = chunks.get(key);
  if (!chunk) {
    chunk = generateChunk(cx, cy);
    chunks.set(key, chunk);
  }
  return chunk;
}

function topWall(c, r) {
  const cx = Math.floor(c / CHUNK), cy = Math.floor(r / CHUNK);
  return getChunk(cx, cy).h[r - cy * CHUNK][c - cx * CHUNK];
}

function leftWall(c, r) {
  const cx = Math.floor(c / CHUNK), cy = Math.floor(r / CHUNK);
  return getChunk(cx, cy).v[r - cy * CHUNK][c - cx * CHUNK];
}

function chunkCanvas(chunk) {
  if (chunk.canvas) return chunk.canvas;
  const size = CHUNK * CELL + CHUNK_PAD * 2;
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const m = cv.getContext("2d");
  m.translate(CHUNK_PAD, CHUNK_PAD);
  m.shadowColor = "#5c6bc0";
  m.shadowBlur = 12;
  m.fillStyle = "#3949ab";
  for (let r = 0; r < CHUNK; r++) {
    for (let c = 0; c < CHUNK; c++) {
      if (chunk.h[r][c]) m.fillRect(c * CELL - WALL / 2, r * CELL - WALL / 2, CELL + WALL, WALL);
      if (chunk.v[r][c]) m.fillRect(c * CELL - WALL / 2, r * CELL - WALL / 2, WALL, CELL + WALL);
    }
  }
  chunk.canvas = cv;
  return cv;
}

function evictFarChunks() {
  const pcx = Math.floor(player.x / CELL / CHUNK);
  const pcy = Math.floor(player.y / CELL / CHUNK);
  for (const [key, chunk] of chunks) {
    if (Math.max(Math.abs(chunk.cx - pcx), Math.abs(chunk.cy - pcy)) > CHUNK_KEEP_DISTANCE) {
      chunks.delete(key);
    }
  }
}

function cellOf(x, y) {
  return { c: Math.floor(x / CELL), r: Math.floor(y / CELL) };
}

function cellCenter(c, r) {
  return { x: (c + 0.5) * CELL, y: (r + 0.5) * CELL };
}

function openNeighbors(c, r) {
  const n = [];
  if (!topWall(c, r)) n.push({ c, r: r - 1 });
  if (!topWall(c, r + 1)) n.push({ c, r: r + 1 });
  if (!leftWall(c, r)) n.push({ c: c - 1, r });
  if (!leftWall(c + 1, r)) n.push({ c: c + 1, r });
  return n;
}

function wallsNear(x, y) {
  const { c, r } = cellOf(x, y);
  const rects = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const cc = c + dc, rr = r + dr;
      if (topWall(cc, rr)) rects.push({ x: cc * CELL - WALL / 2, y: rr * CELL - WALL / 2, w: CELL + WALL, h: WALL });
      if (leftWall(cc, rr)) rects.push({ x: cc * CELL - WALL / 2, y: rr * CELL - WALL / 2, w: WALL, h: CELL + WALL });
    }
  }
  return rects;
}

function pushOutOfWalls(o) {
  for (const w of wallsNear(o.x, o.y)) {
    if (o.x + o.r < w.x || o.x - o.r > w.x + w.w || o.y + o.r < w.y || o.y - o.r > w.y + w.h) continue;
    const nx = Math.max(w.x, Math.min(o.x, w.x + w.w));
    const ny = Math.max(w.y, Math.min(o.y, w.y + w.h));
    const dx = o.x - nx, dy = o.y - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 >= o.r * o.r) continue;
    if (d2 > 0) {
      const d = Math.sqrt(d2);
      const push = (o.r - d) / d;
      o.x += dx * push;
      o.y += dy * push;
    } else {
      const left = o.x - w.x, right = w.x + w.w - o.x;
      const top = o.y - w.y, bottom = w.y + w.h - o.y;
      const min = Math.min(left, right, top, bottom);
      if (min === left) o.x = w.x - o.r;
      else if (min === right) o.x = w.x + w.w + o.r;
      else if (min === top) o.y = w.y - o.r;
      else o.y = w.y + w.h + o.r;
    }
  }
}

function hitsWall(x, y, r) {
  for (const w of wallsNear(x, y)) {
    const nx = Math.max(w.x, Math.min(x, w.x + w.w));
    const ny = Math.max(w.y, Math.min(y, w.y + w.h));
    if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return true;
  }
  return false;
}

function lineOfSight(x1, y1, x2, y2) {
  let { c, r } = cellOf(x1, y1);
  const end = cellOf(x2, y2);
  const dx = x2 - x1, dy = y2 - y1;
  const stepC = Math.sign(dx), stepR = Math.sign(dy);
  let tMaxX = dx ? ((stepC > 0 ? (c + 1) * CELL : c * CELL) - x1) / dx : Infinity;
  let tMaxY = dy ? ((stepR > 0 ? (r + 1) * CELL : r * CELL) - y1) / dy : Infinity;
  const tDeltaX = dx ? CELL / Math.abs(dx) : Infinity;
  const tDeltaY = dy ? CELL / Math.abs(dy) : Infinity;
  const maxSteps = Math.abs(end.c - c) + Math.abs(end.r - r) + 2;
  for (let i = 0; i < maxSteps; i++) {
    if (c === end.c && r === end.r) return true;
    if (tMaxX < tMaxY) {
      if (leftWall(stepC > 0 ? c + 1 : c, r)) return false;
      c += stepC;
      tMaxX += tDeltaX;
    } else {
      if (topWall(c, stepR > 0 ? r + 1 : r)) return false;
      r += stepR;
      tMaxY += tDeltaY;
    }
  }
  return true;
}

// ---------- Path finding toward the player ----------

let dist, distKey = "", boxC0, boxR0, boxW, boxH;

function updateDistances() {
  const { c, r } = cellOf(player.x, player.y);
  const halfW = Math.ceil(W / CELL / 2) + PATH_MARGIN;
  const halfH = Math.ceil(H / CELL / 2) + PATH_MARGIN;
  const key = `${c},${r},${halfW},${halfH}`;
  if (key === distKey) return;
  distKey = key;
  boxC0 = c - halfW;
  boxR0 = r - halfH;
  boxW = halfW * 2 + 1;
  boxH = halfH * 2 + 1;
  dist = new Float32Array(boxW * boxH).fill(Infinity);
  dist[(r - boxR0) * boxW + (c - boxC0)] = 0;
  const queue = [{ c, r }];
  for (let i = 0; i < queue.length; i++) {
    const cur = queue[i];
    const d = getDist(cur.c, cur.r);
    for (const n of openNeighbors(cur.c, cur.r)) {
      if (!inBox(n.c, n.r)) continue;
      const idx = (n.r - boxR0) * boxW + (n.c - boxC0);
      if (dist[idx] === Infinity) {
        dist[idx] = d + 1;
        queue.push(n);
      }
    }
  }
}

function inBox(c, r) {
  return c >= boxC0 && c < boxC0 + boxW && r >= boxR0 && r < boxR0 + boxH;
}

function getDist(c, r) {
  return inBox(c, r) ? dist[(r - boxR0) * boxW + (c - boxC0)] : Infinity;
}

// ---------- Game state ----------

let player, bullets, enemies, particles, bonuses, score, lives, elapsed;
let shootTimer, spawnTimer, invulnerable, running = false, lastTime = 0;
let shots, shotsTimer, bonusTimer, evictTimer, camX = 0, camY = 0;

function reset() {
  worldSeed = (Math.random() * 2 ** 32) >>> 0;
  chunks.clear();
  distKey = "";
  const start = cellCenter(0, 0);
  player = { x: start.x, y: start.y, r: 16, speed: 220, aim: 0, aimTimer: 0, walk: 0, moving: false };
  bullets = [];
  enemies = [];
  particles = [];
  bonuses = [];
  score = 0;
  lives = 3;
  elapsed = 0;
  shootTimer = 0;
  spawnTimer = 1;
  invulnerable = 0;
  shots = 1;
  shotsTimer = 0;
  bonusTimer = 6;
  evictTimer = 2;
  updateCamera();
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  updateShotsHud();
}

function updateCamera() {
  camX = player.x - W / 2;
  camY = player.y - H / 2;
}

function visibleCells() {
  return {
    c0: Math.floor(camX / CELL),
    c1: Math.floor((camX + W) / CELL),
    r0: Math.floor(camY / CELL),
    r1: Math.floor((camY + H) / CELL),
  };
}

function onScreen(x, y, margin = 0) {
  return x > camX - margin && x < camX + W + margin && y > camY - margin && y < camY + H + margin;
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

const ZOMBIE_SHIRTS = ["#5d4037", "#455a64", "#6a1b9a", "#33691e", "#78909c", "#8d6e63", "#7f1d1d"];
const ZOMBIE_PANTS = ["#3e2723", "#263238", "#37474f", "#4e342e"];

function updateShotsHud() {
  shotsEl.textContent = shots > 1 ? `x${shots} (${Math.ceil(shotsTimer)}s)` : "x1";
}

function spawnBonus() {
  const { c0, c1, r0, r1 } = visibleCells();
  const pc = cellOf(player.x, player.y);
  for (let attempt = 0; attempt < 20; attempt++) {
    const c = randInt(c0 + 1, c1 - 1);
    const r = randInt(r0 + 1, r1 - 1);
    const d = getDist(c, r);
    if (d < 2 || d === Infinity || (c === pc.c && r === pc.r)) continue;
    const p = cellCenter(c, r);
    bonuses.push({ x: p.x, y: p.y, r: 12, life: BONUS_LIFETIME });
    return;
  }
}

function spawnEnemy() {
  if (enemies.length >= MAX_ENEMIES) return;
  const { c0, c1, r0, r1 } = visibleCells();
  for (let attempt = 0; attempt < 20; attempt++) {
    let c, r;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { c = randInt(c0 - 1, c1 + 1); r = r0 - 1; }
    else if (side === 1) { c = c1 + 1; r = randInt(r0 - 1, r1 + 1); }
    else if (side === 2) { c = randInt(c0 - 1, c1 + 1); r = r1 + 1; }
    else { c = c0 - 1; r = randInt(r0 - 1, r1 + 1); }
    if (getDist(c, r) === Infinity) continue;

    const p = cellCenter(c, r);
    const radius = 9 + Math.random() * 7;
    const hp = radius > 13 ? 2 : 1;
    enemies.push({
      x: p.x + (Math.random() - 0.5) * 10,
      y: p.y + (Math.random() - 0.5) * 10,
      r: radius,
      hp,
      maxHp: hp,
      speed: 45 + Math.random() * 30 + elapsed * 1.2,
      skin: `hsl(${75 + Math.random() * 35}, 38%, ${40 + Math.random() * 10}%)`,
      shirt: pick(ZOMBIE_SHIRTS),
      pants: pick(ZOMBIE_PANTS),
      walk: Math.random() * Math.PI * 2,
      flash: 0,
    });
    return;
  }
}

function nearestVisibleEnemy() {
  const candidates = enemies
    .filter(e => onScreen(e.x, e.y))
    .map(e => ({ e, d: (e.x - player.x) ** 2 + (e.y - player.y) ** 2 }))
    .sort((a, b) => a.d - b.d);
  for (const { e } of candidates) {
    if (lineOfSight(player.x, player.y, e.x, e.y)) return e;
  }
  return null;
}

function shoot() {
  const target = nearestVisibleEnemy();
  if (!target) return;
  const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
  player.aim = baseAngle;
  player.aimTimer = 0.5;
  const speed = 600;
  const spread = 0.15;
  for (let i = 0; i < shots; i++) {
    const angle = baseAngle + (i - (shots - 1) / 2) * spread;
    bullets.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 5,
    });
  }
}

function explode(x, y, color, count = 14) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 50 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
  }
}

function moveEnemy(e, dt) {
  const { c, r } = cellOf(e.x, e.y);
  const d = getDist(c, r);
  let tx = player.x, ty = player.y;
  if (d > 0 && d !== Infinity) {
    const next = openNeighbors(c, r).find(n => getDist(n.c, n.r) < d);
    if (next) {
      const here = cellCenter(c, r);
      const there = cellCenter(next.c, next.r);
      if (next.r === r) { tx = there.x; ty = here.y; }
      else { tx = here.x; ty = there.y; }
    }
  }
  const dx = tx - e.x, dy = ty - e.y;
  const len = Math.hypot(dx, dy);
  if (len > 0) {
    const step = Math.min(len, e.speed * dt);
    e.x += (dx / len) * step;
    e.y += (dy / len) * step;
  }
}

function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const min = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= min * min || d2 === 0) continue;
      const d = Math.sqrt(d2);
      const push = (min - d) / d / 2;
      a.x -= dx * push; a.y -= dy * push;
      b.x += dx * push; b.y += dy * push;
    }
  }
}

function update(dt) {
  elapsed += dt;

  let dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;
  player.moving = !!(dx || dy);
  player.aimTimer -= dt;
  if (player.moving) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * dt;
    player.y += (dy / len) * player.speed * dt;
    pushOutOfWalls(player);
    player.walk += dt * 14;
    if (player.aimTimer <= 0) player.aim = Math.atan2(dy, dx);
  }
  updateCamera();
  updateDistances();

  evictTimer -= dt;
  if (evictTimer <= 0) {
    evictFarChunks();
    evictTimer = 2;
  }

  const fireInterval = Math.max(0.08, 0.2 - elapsed * 0.002);
  shootTimer -= dt;
  if (shootTimer <= 0) {
    shoot();
    shootTimer = fireInterval;
  }

  const spawnInterval = Math.max(0.2, 1.1 - elapsed * 0.012);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const count = 1 + Math.floor(elapsed / 40);
    for (let i = 0; i < count; i++) spawnEnemy();
    spawnTimer = spawnInterval;
  }

  bonusTimer -= dt;
  if (bonusTimer <= 0) {
    spawnBonus();
    bonusTimer = 8 + Math.random() * 4;
  }

  for (const bonus of bonuses) {
    bonus.life -= dt;
    if ((bonus.x - player.x) ** 2 + (bonus.y - player.y) ** 2 < (bonus.r + player.r) ** 2) {
      bonus.life = 0;
      shots = Math.min(MAX_SHOTS, shots + 1);
      shotsTimer = BONUS_DURATION;
      explode(bonus.x, bonus.y, "#b388ff", 20);
    }
  }
  bonuses = bonuses.filter(b => b.life > 0);

  if (shots > 1) {
    shotsTimer -= dt;
    if (shotsTimer <= 0) {
      shots--;
      shotsTimer = shots > 1 ? BONUS_DURATION : 0;
    }
  }
  updateShotsHud();

  for (const b of bullets) {
    const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 6);
    for (let s = 0; s < steps; s++) {
      b.x += (b.vx * dt) / steps;
      b.y += (b.vy * dt) / steps;
      if (hitsWall(b.x, b.y, b.r)) {
        b.dead = true;
        explode(b.x, b.y, "#fff59d", 3);
        break;
      }
    }
    if (!onScreen(b.x, b.y, 50)) b.dead = true;
  }

  for (const e of enemies) {
    const { c, r } = cellOf(e.x, e.y);
    if (!inBox(c, r)) e.dead = true;
    else moveEnemy(e, dt);
    e.walk += dt * e.speed / 9;
    if (e.flash > 0) e.flash -= dt;
  }
  separateEnemies();
  for (const e of enemies) pushOutOfWalls(e);

  for (const e of enemies) {
    if (e.dead) continue;
    for (const b of bullets) {
      if (b.dead) continue;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < (e.r + b.r) ** 2) {
        b.dead = true;
        e.hp--;
        e.flash = 0.1;
        if (e.hp <= 0) {
          e.dead = true;
          score += e.maxHp;
          scoreEl.textContent = score;
          explode(e.x, e.y, e.skin, 10);
          explode(e.x, e.y, "#8e0000", 6);
          break;
        }
      }
    }
  }

  if (invulnerable > 0) invulnerable -= dt;
  for (const e of enemies) {
    if (e.dead) continue;
    if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 < (e.r + player.r) ** 2) {
      e.dead = true;
      explode(e.x, e.y, e.skin);
      if (invulnerable <= 0) {
        lives--;
        livesEl.textContent = lives;
        invulnerable = 1.5;
        explode(player.x, player.y, "#ff5252", 24);
        if (lives <= 0) return gameOver();
      }
    }
  }

  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function circle(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0d0f1a";
  ctx.fillRect(0, 0, W, H);
  ctx.translate(-Math.round(camX), -Math.round(camY));

  const chunkSize = CHUNK * CELL;
  const cx0 = Math.floor((camX - CHUNK_PAD) / chunkSize);
  const cx1 = Math.floor((camX + W + CHUNK_PAD) / chunkSize);
  const cy0 = Math.floor((camY - CHUNK_PAD) / chunkSize);
  const cy1 = Math.floor((camY + H + CHUNK_PAD) / chunkSize);
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      ctx.drawImage(chunkCanvas(getChunk(cx, cy)), cx * chunkSize - CHUNK_PAD, cy * chunkSize - CHUNK_PAD);
    }
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    circle(p.x, p.y, 3, p.color);
  }
  ctx.globalAlpha = 1;

  for (const bonus of bonuses) {
    const fading = bonus.life < 2 && Math.floor(bonus.life * 8) % 2 === 0;
    if (fading) continue;
    const pulse = 1 + Math.sin(elapsed * 6) * 0.12;
    const r = bonus.r * pulse;
    ctx.shadowColor = "#b388ff";
    ctx.shadowBlur = 20;
    circle(bonus.x, bonus.y, r, "#7c4dff");
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bonus.x - r * 0.5, bonus.y);
    ctx.lineTo(bonus.x + r * 0.5, bonus.y);
    ctx.moveTo(bonus.x, bonus.y - r * 0.5);
    ctx.lineTo(bonus.x, bonus.y + r * 0.5);
    ctx.stroke();
  }

  const blink = invulnerable > 0 && Math.floor(invulnerable * 10) % 2 === 0;
  const actors = enemies.filter(e => onScreen(e.x, e.y, 40));
  if (!blink) actors.push(player);
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a === player) drawMan(player);
    else drawZombie(a);
  }

  ctx.shadowColor = "#fff59d";
  ctx.shadowBlur = 10;
  for (const b of bullets) circle(b.x, b.y, 3.5, "#fff59d");
  ctx.shadowBlur = 0;
}

function shadow(y, rx) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.beginPath();
  ctx.ellipse(0, y, rx, rx * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMan(p) {
  const facing = Math.cos(p.aim) >= 0 ? 1 : -1;
  const swing = p.moving ? Math.sin(p.walk) * 4 : 0;
  const skin = "#f1c27d";
  const shirt = "#26a69a";

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.r / 16, p.r / 16);
  shadow(16, 11);
  ctx.scale(facing, 1);

  ctx.fillStyle = "#1e3a8a";
  ctx.fillRect(-6 + swing * 0.5, 4, 5, 11);
  ctx.fillRect(1 - swing * 0.5, 4, 5, 11);
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(-6 + swing * 0.5, 14, 6, 3);
  ctx.fillRect(1 - swing * 0.5, 14, 6, 3);

  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.roundRect(-7, -7, 14, 13, 4);
  ctx.fill();
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(-7, 3, 14, 2);

  circle(0, -13, 6.5, skin);
  ctx.fillStyle = "#4e342e";
  ctx.beginPath();
  ctx.arc(0, -14, 7, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-7, -14, 4, 5);
  ctx.fillStyle = "#222";
  ctx.fillRect(2.5, -13, 2, 2);

  const localAim = facing === 1 ? p.aim : Math.PI - p.aim;
  ctx.save();
  ctx.translate(1, -3);
  ctx.rotate(localAim);
  ctx.fillStyle = shirt;
  ctx.fillRect(0, -2, 5, 4);
  ctx.fillStyle = skin;
  ctx.fillRect(5, -1.5, 5, 3);
  ctx.fillStyle = "#263238";
  ctx.fillRect(9, -2.5, 10, 4);
  ctx.fillRect(9, 0.5, 3, 4);
  ctx.restore();

  ctx.restore();
}

function drawZombie(e) {
  const facing = player.x >= e.x ? 1 : -1;
  const swing = Math.sin(e.walk) * 3;
  const bob = Math.abs(Math.sin(e.walk)) * 1.5;
  const sway = Math.sin(e.walk * 0.5) * 1.2;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(e.r / 12, e.r / 12);
  shadow(13, 9);
  ctx.scale(facing, 1);
  ctx.translate(0, -bob);

  ctx.fillStyle = e.pants;
  ctx.fillRect(-5 + swing * 0.5, 3, 4, 10);
  ctx.fillRect(1 - swing * 0.5, 3, 4, 10);

  ctx.fillStyle = e.skin;
  ctx.fillRect(0, -5 + sway, 12, 3);

  ctx.fillStyle = e.shirt;
  ctx.beginPath();
  ctx.moveTo(-6, -6);
  ctx.lineTo(6, -6);
  ctx.lineTo(6, 4);
  ctx.lineTo(4, 6);
  ctx.lineTo(2, 4);
  ctx.lineTo(0, 6);
  ctx.lineTo(-2, 4);
  ctx.lineTo(-4, 6);
  ctx.lineTo(-6, 4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = e.skin;
  ctx.fillRect(1, -2 - sway, 12, 3);

  ctx.save();
  ctx.translate(1, -11);
  ctx.rotate(0.25);
  circle(0, 0, 6, e.skin);
  ctx.fillStyle = "#1b1b1b";
  ctx.fillRect(-5, -6, 3, 2);
  ctx.fillRect(-1, -7, 2, 2);
  ctx.fillRect(2, -6, 2, 2);
  ctx.shadowColor = "#ff1744";
  ctx.shadowBlur = 6;
  circle(2.5, -1, 1.4, "#ff1744");
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#3e2723";
  ctx.fillRect(1, 2, 4, 1.5);
  ctx.restore();

  ctx.restore();

  if (e.flash > 0) circle(e.x, e.y - e.r * 0.3, e.r * 1.1, "rgba(255, 255, 255, 0.55)");

  if (e.maxHp > 1 && e.hp < e.maxHp) {
    const w = e.r * 2;
    const y = e.y - e.r * 2;
    ctx.fillStyle = "#000";
    ctx.fillRect(e.x - w / 2, y, w, 4);
    ctx.fillStyle = "#e53935";
    ctx.fillRect(e.x - w / 2, y, w * (e.hp / e.maxHp), 4);
  }
}

function loop(time) {
  if (!running) return;
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function start() {
  reset();
  overlay.classList.add("hidden");
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  overlay.innerHTML = `
    <h1>Game Over</h1>
    <p>The zombies got you after ${elapsed.toFixed(1)}s. You scored ${score} points.</p>
    <button id="start">Play again</button>`;
  overlay.classList.remove("hidden");
  document.getElementById("start").addEventListener("click", start);
}

startBtn.addEventListener("click", start);
</script>
</body>
</html>
