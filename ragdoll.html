<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Man vs the Gangsters 3D</title>
<link rel="stylesheet" href="ragdoll/style.css">
</head>
<body>
<div id="fade"></div>
<div id="hud"><div class="score" id="block">Block 1</div><div class="street" id="street"></div><div class="hearts" id="hearts"></div><div class="ammo" id="ammo"></div><div class="crew" id="crew"></div><div class="sub" id="sub"></div></div>
<div id="banner"><div class="title" id="bannerTitle"></div><div class="small" id="bannerSub"></div></div>
<div id="boss"><div class="name">Big Tony</div><div class="bar"><div id="bossFill"></div></div></div>
<div id="skins"><span class="label">Skin</span><button id="skinPrev" title="Previous skin">◀</button><span id="skinName"></span><button id="skinNext" title="Next skin (C)">▶</button></div>
<button id="camBtn"></button>
<button id="playBtn">Playing: The Man (R)</button>
<button id="zombieBtn">Zombie night: Off (Z)</button>
<button id="streetBtn">↑ Back to the street</button>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="ragdoll/main.js"></script>
</body>
</html>
